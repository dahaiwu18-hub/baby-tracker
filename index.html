<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="宝宝记录">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%23FF6B6B'/%3E%3Ctext x='96' y='130' font-size='120' text-anchor='middle' fill='white'%3E🍼%3C/text%3E%3C/svg%3E">
  <title>宝宝成长记录</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.0/dist/umd/supabase.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ====== 启动加载 ====== -->
  <div id="splash" class="splash">
    <div class="splash-icon">🍼</div>
    <div class="splash-text">宝宝成长记录</div>
    <div class="splash-loading"><div class="spinner"></div></div>
  </div>

  <!-- ====== 未配置提示 ====== -->
  <div id="setup-warning" class="setup-warning" style="display:none">
    <div class="setup-card">
      <div class="setup-icon">⚙️</div>
      <h2>需要先完成设置</h2>
      <p>首次使用请先配置数据库和宝宝信息</p>
      <button class="btn btn-primary" onclick="document.getElementById('setup-warning').style.display='none';document.getElementById('app').style.display='flex';App.navigate('settings')">前往设置</button>
    </div>
  </div>

  <!-- ====== 主应用 ====== -->
  <div id="app" class="app" style="display:none">

    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="header-left">
        <span class="header-baby-name" id="headerBabyName">宝宝</span>
        <span class="header-date" id="headerDate"></span>
      </div>
      <div class="header-right">
        <button class="header-btn" onclick="App.navigate('settings')" title="设置">⚙️</button>
      </div>
    </header>

    <!-- 页面容器 -->
    <main class="app-content" id="appContent">
      <!-- 各页面由 JS 动态渲染 -->
    </main>

    <!-- 底部导航栏 -->
    <nav class="app-nav" id="appNav">
      <button class="nav-item active" data-page="dashboard" onclick="App.navigate('dashboard')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">首页</span>
      </button>
      <button class="nav-item" data-page="records" onclick="App.navigate('records')">
        <span class="nav-icon">✏️</span>
        <span class="nav-label">记录</span>
      </button>
      <button class="nav-item" data-page="chat" onclick="App.navigate('chat')">
        <span class="nav-icon"><img src="./assets/pony.png" style="width:24px;height:24px;border-radius:50%;object-fit:cover"></span>
        <span class="nav-label">AI</span>
      </button>
      <button class="nav-item" data-page="history" onclick="App.navigate('history')">
        <span class="nav-icon">📈</span>
        <span class="nav-label">统计</span>
      </button>
    </nav>

  </div>

  <!-- ====== JS 模块 ====== -->
  <script src="js/supabase.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
